<vb-popup
  class="document-detail-popup"
  [(open)]="open"
  title="Document details"
  [subtitle]="row()?.id ?? ''"
  close-aria-label="Close document details"
>
  @if (row(); as doc) {
    <section class="detail-section">
      <h3>ID</h3>
      <code class="id-block">{{ doc.id }}</code>
    </section>
    <section class="detail-section">
      <h3>Document</h3>
      <pre class="document-block">{{ doc.document ?? '—' }}</pre>
    </section>
    <section class="detail-section">
      <h3>Metadata</h3>
      <pre class="metadata-block">{{ formatMetadata(doc.metadata) }}</pre>
    </section>
    <section class="detail-section">
      <h3>Embedding</h3>
      <pre class="embedding-block">{{ embeddingSummary(doc) }}</pre>
    </section>
  }

  <div vbPopupActions>
    <vb-button variant="filled" label="Close" iconClass="bx bx-check" (click)="close()" />
  </div>
</vb-popup>
